<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Transmission Lost | EES Genesis</title>
  <link rel="icon" href="/favicon.ico" sizes="any" />
  <meta name="theme-color" content="#031834" />
  <style>
    :root{color-scheme:dark;font-family:Inter,Arial,sans-serif}
    *{box-sizing:border-box}
    body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;color:#effbff;
      background:
        radial-gradient(circle at 50% 25%,rgba(29,126,210,.28),transparent 38%),
        radial-gradient(circle at 15% 85%,rgba(61,226,255,.12),transparent 30%),
        #020a1a;overflow:hidden}
    body::before{content:"";position:fixed;inset:0;opacity:.34;pointer-events:none;
      background-image:radial-gradient(circle,#a8efff 0 1px,transparent 1.5px);
      background-size:70px 70px}
    main{position:relative;z-index:1;width:min(680px,100%);padding:40px;border:1px solid rgba(86,216,255,.34);
      border-radius:24px;text-align:center;background:linear-gradient(145deg,rgba(2,18,42,.95),rgba(7,35,68,.9));
      box-shadow:0 36px 120px rgba(0,0,0,.7),0 0 52px rgba(63,208,255,.13)}
    .orbit{width:96px;height:96px;margin:0 auto 22px;border:3px solid #31d8ff;border-radius:50%;
      display:grid;place-items:center;box-shadow:0 0 34px rgba(49,216,255,.32);font-weight:900;font-size:26px}
    .eyebrow{color:#52dcff;font-size:12px;font-weight:800;letter-spacing:.2em}
    h1{margin:12px 0;font-size:clamp(2rem,7vw,4.4rem)}
    p{margin:0 auto 28px;max-width:480px;color:#aac4d6;line-height:1.65}
    nav{display:flex;flex-wrap:wrap;justify-content:center;gap:12px}
    a{padding:13px 18px;border:1px solid rgba(91,221,255,.5);border-radius:10px;color:#effbff;
      text-decoration:none;font-weight:800;font-size:13px;letter-spacing:.05em;background:rgba(6,50,89,.82)}
    a:hover,a:focus{border-color:#8ceaff;box-shadow:0 0 24px rgba(73,210,255,.24);outline:none}
  </style>
</head>
<body>
  <main>
    <div class="orbit">EES</div>
    <div class="eyebrow">ERROR 404 // NAVIGATION SIGNAL LOST</div>
    <h1>Transmission Lost</h1>
    <p>The requested sector could not be located. Reconnect with EES Genesis or return to the primary portfolio gateway.</p>
    <nav>
      <a href="/">Return to EES Genesis</a>
      <a href="https://jeremiahlupton.com/">Return Home</a>
    </nav>
  </main>
</body>
</html>
